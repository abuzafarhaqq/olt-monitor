# Local development database. Not for production: the password is in the file.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: oltmon
      POSTGRES_PASSWORD: oltmon
      POSTGRES_DB: oltmon
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oltmon"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
